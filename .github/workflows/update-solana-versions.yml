name: Update Solana Versions

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests PyGithub
      
      - name: Fetch Solana versions
        id: fetch_versions
        run: python3 .github/scripts/fetch_versions.py
      
      - name: Update solana-versions.properties
        id: update_file
        run: python3 .github/scripts/update_versions_file.py
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet solana-versions.properties; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff solana-versions.properties
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add solana-versions.properties
          git commit -m "chore: Update Solana versions from networks and releases"
          git push
