name: Test Solana Versions Matrix

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Parse versions file and create matrix
        id: set-matrix
        run: |
          python3 << 'EOF'
          import json
          import sys
          
          versions = {}
          try:
              with open('solana-versions.properties', 'r') as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith('#') and '=' in line:
                          key, value = line.split('=', 1)
                          if value != 'unknown':
                              versions[key] = value
          except FileNotFoundError:
              print("solana-versions.properties not found, using default", file=sys.stderr)
              # Fallback to gradle.properties
              try:
                  with open('gradle.properties', 'r') as f:
                      for line in f:
                          if line.startswith('SOLANA_VERSION='):
                              version = line.split('=')[1].strip()
                              versions['current'] = version
                              break
              except Exception as e:
                  print(f"Error reading gradle.properties: {e}", file=sys.stderr)
                  versions['current'] = '2.1.21'
          
          # Create matrix with unique versions
          unique_versions = list(set(versions.values()))
          matrix_config = {
              "include": [
                  {"version": v, "label": k} 
                  for k, v in versions.items()
              ]
          }
          
          # Deduplicate by version, keeping first label
          seen_versions = set()
          deduplicated = []
          for item in matrix_config["include"]:
              if item["version"] not in seen_versions:
                  seen_versions.add(item["version"])
                  deduplicated.append(item)
          
          matrix_config["include"] = deduplicated
          
          print(f"Matrix config: {json.dumps(matrix_config, indent=2)}")
          print(f"matrix={json.dumps(matrix_config)}")
          
          # Write to GitHub output
          with open(sys.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix_config)}\n")
          
          EOF
  
  test:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5
      
      - name: Update Solana version in gradle.properties
        run: |
          sed -i "s/SOLANA_VERSION=.*/SOLANA_VERSION=${{ matrix.version }}/" gradle.properties
          echo "Testing with Solana version ${{ matrix.version }} (label: ${{ matrix.label }})"
          cat gradle.properties
      
      - name: Build with Gradle
        id: build
        run: ./gradlew build -i
        continue-on-error: true
        timeout-minutes: 30
      
      - name: Save test results
        if: always()
        run: |
          mkdir -p test-results
          find . -type f -name "TEST-*.xml" -exec cp {} test-results/ \; || true
          find . -type f -name "*.log" -path "*/build/reports/*" -exec cp {} test-results/ \; || true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.label }}-${{ matrix.version }}
          path: test-results/
          retention-days: 30
      
      - name: Report test failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "Tests failed for Solana version ${{ matrix.version }} (label: ${{ matrix.label }})"
          echo "test_failed=true" >> $GITHUB_ENV
          echo "test_version=${{ matrix.version }}" >> $GITHUB_ENV
          echo "test_label=${{ matrix.label }}" >> $GITHUB_ENV
  
  report-failures:
    needs: test
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create issue for test failures
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Get workflow run details
            const runId = context.runId;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            
            // Create issue title and body
            const title = `🚨 Solana Version Tests Failed - Run #${runId}`;
            const body = `## Test Failure Report
            
            The Solana version matrix tests have failed in workflow run [#${runId}](${runUrl}).
            
            ### Details
            - **Workflow**: ${context.workflow}
            - **Trigger**: ${context.eventName}
            - **Branch**: ${context.ref}
            - **Commit**: ${context.sha.substring(0, 7)}
            
            ### Action Required
            Please investigate the test failures by reviewing the workflow run logs and test artifacts.
            
            ### Links
            - [View Workflow Run](${runUrl})
            - [View Test Artifacts](${runUrl}#artifacts)
            
            ---
            *This issue was automatically created by the test-solana-versions workflow.*
            `;
            
            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['test-failure', 'solana-version'],
              per_page: 10
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes('Solana Version Tests Failed')
            );
            
            if (existingIssue) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Another test failure occurred in [workflow run #${runId}](${runUrl})`
              });
              console.log(`Added comment to existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['test-failure', 'solana-version', 'automated']
              });
              console.log(`Created issue #${issue.data.number}`);
            }
