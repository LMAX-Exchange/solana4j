name: Test Solana Versions Matrix

on:
  # Run on pushes to master after the standard CI passes
  push:
    branches: [ "master" ]
  # Run on PRs targeting master
  pull_request:
    branches: [ "master" ]
  # Allow manual trigger
  workflow_dispatch:
  # Run daily to catch new version issues quickly
  schedule:
    - cron: '0 4 * * *'  # Daily at 4 AM UTC (after version update at 2 AM)

permissions:
  contents: read
  issues: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Parse versions file and create matrix
        id: set-matrix
        run: python3 .github/scripts/prepare_matrix.py
  
  test:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5
      
      - name: Update Solana version in gradle.properties
        run: |
          # Update SOLANA_VERSION property which is read by build.gradle
          # and passed to integration tests via systemProperty
          sed -i "s/SOLANA_VERSION=.*/SOLANA_VERSION=${{ matrix.version }}/" gradle.properties
          echo "Testing with Solana version ${{ matrix.version }} (label: ${{ matrix.label }})"
          cat gradle.properties
      
      - name: Build with Gradle
        id: build
        run: ./gradlew build -i
        continue-on-error: true
        timeout-minutes: 30
      
      - name: Save test results
        if: always()
        run: |
          mkdir -p test-results
          find . -type f -name "TEST-*.xml" -exec cp {} test-results/ \; || true
          find . -type f -name "*.log" -path "*/build/reports/*" -exec cp {} test-results/ \; || true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.label }}-${{ matrix.version }}
          path: test-results/
          retention-days: 30
      
      - name: Report test failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "Tests failed for Solana version ${{ matrix.version }} (label: ${{ matrix.label }})"
          echo "test_failed=true" >> $GITHUB_ENV
          echo "test_version=${{ matrix.version }}" >> $GITHUB_ENV
          echo "test_label=${{ matrix.label }}" >> $GITHUB_ENV
  
  report-failures:
    needs: test
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create or update issue for test failures
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Get workflow run details
            const runId = context.runId;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            
            // Create issue title and body
            const title = `🚨 Solana Version Tests Failed`;
            const body = `## Test Failure Report
            
            The Solana version matrix tests have failed in workflow run [#${runId}](${runUrl}).
            
            ### Details
            - **Workflow**: ${context.workflow}
            - **Trigger**: ${context.eventName}
            - **Branch**: ${context.ref}
            - **Commit**: ${context.sha.substring(0, 7)}
            
            ### Action Required
            Please investigate the test failures by reviewing the workflow run logs and test artifacts.
            
            ### Links
            - [View Workflow Run](${runUrl})
            - [View Test Artifacts](${runUrl}#artifacts)
            
            ---
            *This issue was automatically created by the test-solana-versions workflow.*
            `;
            
            // Check if issue with this title already exists (open or closed recently)
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['test-failure', 'solana-version'],
              per_page: 100
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title === title
            );
            
            if (existingIssue) {
              // Update existing issue with new failure information
              const commentBody = [
                '## New Test Failure',
                '',
                `Another test failure occurred in [workflow run #${runId}](${runUrl})`,
                '',
                '**Details:**',
                `- Trigger: ${context.eventName}`,
                `- Branch: ${context.ref}`,
                `- Commit: ${context.sha.substring(0, 7)}`
              ].join('\n');
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: commentBody
              });
              console.log(`Updated existing issue #${existingIssue.number} with new failure info`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['test-failure', 'solana-version', 'automated']
              });
              console.log(`Created new issue #${issue.data.number}`);
            }
