name: Java CI with Gradle

on:
  push:
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5

      - name: Setup resource usage collection
        run: |
          # Create a script to log resource usage with timestamps
          echo 'while true; do' > monitor_resources.sh
          echo '  echo "$(date): Disk Usage:" >> resource_usage.log' >> monitor_resources.sh
          echo '  df -h >> resource_usage.log' >> monitor_resources.sh
          echo '  echo "" >> resource_usage.log' >> monitor_resources.sh
          echo '  echo "$(date): CPU Usage:" >> resource_usage.log' >> monitor_resources.sh
          echo '  top -b -n 1 | head -n 10 >> resource_usage.log' >> monitor_resources.sh
          echo '  echo "" >> resource_usage.log' >> monitor_resources.sh
          echo '  echo "$(date): Memory Usage:" >> resource_usage.log' >> monitor_resources.sh
          echo '  free -h >> resource_usage.log' >> monitor_resources.sh
          echo '  echo "" >> resource_usage.log' >> monitor_resources.sh
          echo '  sleep 5' >> monitor_resources.sh
          echo 'done' >> monitor_resources.sh
          
          # Make the script executable
          chmod +x monitor_resources.sh
          
          # Start the script in the background
          nohup ./monitor_resources.sh &

      - name: Build with Gradle Wrapper
        id: gradle_build
        run: ./gradlew build -i || echo "Gradle build failed" > gradle_build_result.txt
        continue-on-error: true

      - name: Upload resource usage log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-usage-log
          path: resource_usage.log

      - name: Check build result
        if: always()
        run: |
          if [ -f gradle_build_result.txt ]; then
            echo "Build failed."
            exit 1
          else
            echo "Build succeeded."
          fi


  jmh-benchmarks:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for baseline comparison
          
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5

      - name: Run JMH Benchmarks
        run: ./gradlew :message-encoding:jmh :message-encoding:jmhReport

      - name: Upload JMH Results (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results-json
          path: message-encoding/build/reports/jmh/results.json

      - name: Upload JMH Results (Text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results-text
          path: message-encoding/build/reports/jmh/results.txt

      - name: Display JMH Results Summary
        if: always()
        run: |
          if [ -f message-encoding/build/reports/jmh/results.txt ]; then
            echo "=== JMH Benchmark Results ==="
            cat message-encoding/build/reports/jmh/results.txt
          else
            echo "No JMH results file found"
          fi

      - name: Fetch and build baseline from master branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          echo "Checking if baseline benchmarks can be built from master branch..."
          
          # Fetch master branch
          git fetch origin master
          
          # Check if jmh task exists on master
          if git show FETCH_HEAD:message-encoding/build.gradle | grep -q "task jmh"; then
            echo "JMH tasks found on master, building baseline..."
            
            # Save current results
            cp message-encoding/build/reports/jmh/results.json current-results.json
            
            # Check out master
            git checkout FETCH_HEAD
            
            # Build and run benchmarks on master with reduced iterations for speed
            ./gradlew clean :message-encoding:jmh -Pjmh.fork=1 -Pjmh.warmup=2 -Pjmh.iterations=3
            
            # Save baseline results to parent directory (outside build dir)
            cp message-encoding/build/reports/jmh/results.json ../baseline-results.json
            
            # Return to PR branch
            git checkout -
            
            # Move baseline to working directory
            mv ../baseline-results.json baseline-results.json
            
            # Restore current results
            mkdir -p message-encoding/build/reports/jmh
            cp current-results.json message-encoding/build/reports/jmh/results.json
            
            echo "✓ Baseline benchmark completed"
          else
            echo "⚠️  JMH tasks not found on master branch (first time setup)"
            echo "Skipping baseline comparison - current results will become the baseline"
          fi

      - name: Compare performance with baseline
        if: github.event_name == 'pull_request'
        run: |
          if [ -f baseline-results.json ]; then
            echo "Comparing current results with baseline..."
            python3 .github/scripts/compare_benchmarks.py baseline-results.json message-encoding/build/reports/jmh/results.json 10
          else
            echo "⚠️  No baseline results available, skipping comparison"
          fi


  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@417ae3ccd767c252f5661f1ace9f835f9654f2b5


  javadoc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Javadoc
        run: ./gradlew javadoc

      - name: Copy Javadocs
        run: mkdir javadoc && cp -r message-encoding/build/docs/javadoc javadoc/message-encoding && cp -r client/build/docs/javadoc javadoc/client

      - name: Copy Index Page
        run: cp index.html javadoc/

      - name: Deploy Pages Content For solana4j
        uses: JamesIves/github-pages-deploy-action@v4.6.4
        # https://stackoverflow.com/questions/64781462/github-actions-default-branch-variable
        if: ${{ always() && format('refs/heads/{0}', github.event.repository.default_branch) == github.ref }}
        with:
          folder: javadoc