plugins {
    id 'java'
    id 'java-library'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'maven-publish'
    id 'checkstyle'
    id 'org.jreleaser' version '1.26.0'
    id 'com.autonomousapps.dependency-analysis' version '3.19.2'
}

def solanaVersion = project.rootProject.property('SOLANA_VERSION')

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
    withJavadocJar()
    withSourcesJar()
}

jar {
    archiveBaseName.set('solana4j-json-rpc')
}

tasks.named('sourcesJar') {
    archiveBaseName.set('solana4j-json-rpc')
}

tasks.named('javadocJar') {
    archiveBaseName.set('solana4j-json-rpc')
}

sourceSets {
    test {
        java {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        java {
            srcDir file('src/integration-test/java')
        }
        resources.srcDir file('src/integration-test/resources')
    }
}

dependencies {

    // main dependencies
    api 'com.fasterxml.jackson.core:jackson-annotations:2.22'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.22.3'
    implementation 'org.slf4j:slf4j-api:2.0.20'

    // unit test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.4'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // integration test dependencies
    integrationTestImplementation project(path: ':shared', configuration: 'sharedTestSupport')
    integrationTestImplementation project(path: ':message-encoding', configuration: 'default')

    integrationTestImplementation 'org.assertj:assertj-core:3.27.7'
    integrationTestImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.4'

    integrationTestRuntimeOnly project(path: ':message-encoding', configuration: 'default')

    integrationTestRuntimeOnly 'org.bouncycastle:bcprov-jdk18on:1.86'
    integrationTestRuntimeOnly 'org.testcontainers:testcontainers:2.0.5'
    integrationTestRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.4'
    integrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    integrationTestRuntimeOnly 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    integrationTestRuntimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
}

tasks.register('unitTest', Test) {
    useJUnitPlatform()
    description = 'Runs the solana client unit tests .'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
    }
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform()
    description = 'Runs the solana client integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
    systemProperty 'solana.version', solanaVersion
    systemProperty 'api.version', '1.45'
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
    }
    maxHeapSize = "1g"
}

tasks.processTestResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Disable the default test task since we use custom unitTest task
tasks.named('test') {
    enabled = false
}

check.dependsOn unitTest
check.dependsOn integrationTest
check.dependsOn checkstyleMain
check.dependsOn checkstyleIntegrationTest

javadoc {
    title = 'solana4j-json-rpc'

    source = fileTree('src/main/java').include('**/*.java')

    options.addStringOption('XDignore.symbol.file', '-quiet')
    options.author = true
    options.bottom = "<i>Copyright &#169; 2011 - ${Calendar.instance[Calendar.YEAR]} LMAX Ltd. All Rights Reserved.</i>"
    options.use = true
    options.version = true
    options.showFromPublic()
}

jreleaser {
    files {
        active = 'ALWAYS'
        glob {
            pattern = 'build/staging-deploy/**/*.jar'
            pattern = 'build/staging-deploy/**/*.pom'
            pattern = 'build/staging-deploy/**/*.module'
        }
    }
    signing {
        active = 'ALWAYS'
        armored = true
        mode = 'MEMORY'
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                    applyMavenCentralRules = true
                }
            }
        }
    }
    gitRootSearch = true
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.lmax'
            artifactId = 'solana4j-json-rpc'

            from components.java

            pom {
                name = 'solana4j-json-rpc'
                description = 'A Java library for communicating with the Solana blockchain.'
                url = 'https://github.com/LMAX-Exchange/solana4j'
                inceptionYear = '2023'
                licenses {
                    license {
                        name = 'Apache-2.0'
                        url = 'https://spdx.org/licenses/Apache-2.0.html'
                    }
                }
                developers {
                    developer {
                        id = 'jamesm'
                        name = 'Matthew James'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/LMAX-Exchange/solana4j.git'
                    developerConnection = 'scm:git:ssh://github.com/LMAX-Exchange/solana4j.git'
                    url = 'https://github.com/LMAX-Exchange/solana4j'
                }
            }
        }
    }

    repositories {
        maven {
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}
